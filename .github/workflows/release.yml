name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend dependencies
        run: npm ci

      - name: Build and release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'v0.1.7 — Latest Developer Build' }}
          releaseBody: |
            ## 🎮 Discord Status Manager

            Native Windows Custom Discord Rich Presence Manager built with Tauri 2.0 & TypeScript.

            ### ✨ Features
            - **⚡ Native RPC Connection:** Connects directly to Discord's local IPC pipe with zero overhead.
            - **📌 System Tray Controls:** Left-click restores the app window; right-click opens the full context menu (*Quit*, *Open Window*, *Disconnect*).
            - **💾 Custom Presets & Templates:** Save, manage, and toggle activity templates seamlessly.
            - **🚀 Auto-Start & Tray Launch:** Option to run automatically on Windows startup and start minimized to tray.

            ---
            *Automated Release Build generated via GitHub Actions CI/CD.*
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
